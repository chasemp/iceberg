name: Update Discovery Data

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Fetch trending repos (daily)
        run: |
          iceberg fetch --source trending --since daily --limit 25

      - name: Fetch trending repos (weekly)
        run: |
          iceberg fetch --source trending --since weekly --limit 25

      - name: Fetch trending repos (monthly)
        run: |
          iceberg fetch --source trending --since monthly --limit 25

      - name: Fetch search - highly starred
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          iceberg fetch --source search --stars ">10000" --limit 50

      - name: Fetch search - Python highly starred
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          iceberg fetch --source search --language python --stars ">5000" --limit 30

      - name: Fetch search - JavaScript highly starred
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          iceberg fetch --source search --language javascript --stars ">5000" --limit 30

      - name: Fetch search - Rust highly starred
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          iceberg fetch --source search --language rust --stars ">3000" --limit 30

      - name: Analyze discovered repos
        run: |
          # Get list of all discovered repos and analyze them
          # This script will analyze all repos found in cache/discovered/
          python scripts/analyze_all_discovered.py
        continue-on-error: true

      - name: Export data for SPA
        run: |
          iceberg export --output-dir ./spa/data

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/ spa/data/
          git diff --staged --quiet || git commit -m "Update discovery data - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./spa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
