name: Publish to GitHub Pages

on:
  # Run after analysis workflow completes
  workflow_run:
    workflows: ["Daily Analysis"]
    types:
      - completed
    branches:
      - main

  # Run on push to spa/ directory
  push:
    branches:
      - main
    paths:
      - 'spa/**'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish:
    # Only run if the triggering workflow succeeded (or not triggered by workflow_run)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export to SPA
        run: |
          iceberg export

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './spa'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
