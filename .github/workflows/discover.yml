name: Weekly Discovery

on:
  schedule:
    # Run weekly on Monday at 6 AM UTC
    - cron: '0 6 * * 1'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          iceberg discover -v 2>&1 | tee discover.log

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add cache/discovered/ cache/repos/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly discovery $(date +%Y-%m-%d)" \
              -m "Automated discovery run" \
              -m "$(tail -20 discover.log)"
            git push
          fi

      - name: Upload discovery log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-log
          path: discover.log
          retention-days: 7
