name: Update Tracked Repos

on:
  # Allow manual trigger
  workflow_dispatch:
  
  # Optional: Run daily for tracked repos
  # schedule:
  #   - cron: '0 12 * * *'  # Noon UTC daily

permissions:
  contents: write

jobs:
  update-tracked:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Install osv-scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/download/v1.9.1/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      
      - name: Update tracked repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_tracked.py 2>&1 | tee tracked.log
      
      - name: Export to SPA
        run: |
          python -m iceberg.cli export
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add cache/ spa/data/ || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update tracked repos $(date +%Y-%m-%d)" \
              -m "Automated tracked repos update"
            git push
          fi
      
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracked-update-log
          path: tracked.log
          retention-days: 7
