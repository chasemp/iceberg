name: Daily Analysis

on:
  schedule:
    # Run daily at 7 AM UTC
    - cron: '0 7 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-analysis regardless of staleness'
        required: false
        default: false
        type: boolean
      batch_size:
        description: 'Number of repos to analyze'
        required: false
        default: '25'
        type: string

permissions:
  contents: write
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install osv-scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify osv-scanner
        run: |
          osv-scanner --version

      - name: Run analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BATCH_SIZE="${{ inputs.batch_size || '25' }}"
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          iceberg run-analysis --batch-size "$BATCH_SIZE" $FORCE_FLAG -v 2>&1 | tee analyze.log

      - name: Export to SPA
        run: |
          iceberg export

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add cache/projects/ cache/loc/ spa/data/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily analysis $(date +%Y-%m-%d)" \
              -m "Automated analysis run" \
              -m "$(tail -20 analyze.log)"
            git push
          fi

      - name: Upload analysis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: analyze.log
          retention-days: 7

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let lastLines = 'Log not available';
            try {
              const log = fs.readFileSync('analyze.log', 'utf8');
              lastLines = log.split('\n').slice(-30).join('\n');
            } catch (e) {}

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Analysis workflow failed - ${new Date().toISOString().split('T')[0]}`,
              body: `The daily analysis workflow failed.\n\n**Last 30 lines of log:**\n\`\`\`\n${lastLines}\n\`\`\`\n\nCheck the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
              labels: ['automation']
            });
